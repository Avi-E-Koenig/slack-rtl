name: Release

# Tag vX.Y.Z (matching extension/manifest.json "version") to publish a GitHub
# release with the store zip attached. Run manually to just build the zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != manifest version v${version}"; exit 1
          fi
      - id: pkg
        run: echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ steps.pkg.outputs.zip }}
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes
